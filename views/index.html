<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Excel OCR Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📄 Image to Excel OCR Service</h1>
      <p class="subtitle">Extract text, tables, and data from images using AI-powered OCR</p>
    </header>

    <main>
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="upload-area" id="uploadArea">
          <input type="file" name="image" accept="image/*" required id="imageInput" />
          <div class="upload-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p class="upload-text">Click to select or drag and drop an image</p>
            <p class="upload-hint">Supports: PNG, JPG, JPEG, GIF, WebP</p>
          </div>
          <div id="fileName" class="file-name"></div>
        </div>

        <div class="button-group">
          <button type="button" onclick="extractData()" class="btn btn-primary" id="extractBtn">
            <span class="btn-icon">🔍</span>
            Extract Data (JSON)
          </button>
          <button type="button" onclick="downloadExcel()" class="btn btn-success" id="excelBtn">
            <span class="btn-icon">📊</span>
            Download as Excel
          </button>
        </div>
      </form>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Processing image... Please wait...</p>
      </div>
      
      <div id="result" class="result-container">
        <div class="result-header">
          <h2>📋 Extracted Data</h2>
          <div class="result-actions">
            <button onclick="downloadJSON()" class="btn btn-small btn-primary">💾 Download as JSON</button>
            <button onclick="copyToClipboard()" class="btn btn-small btn-secondary">📋 Copy Text</button>
            <button onclick="clearResult()" class="btn btn-small btn-danger">🗑️ Clear</button>
          </div>
        </div>
        <div id="extractedData" class="extracted-data"></div>
      </div>
      
      <div id="error" class="error-container"></div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
